name: Convert Markdown to PDF

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 変換するマークダウンに日本語が含まれる場合、日本語フォントをインストールする必要あり
      - name: Install Japanese font
        run: sudo apt-get update && sudo apt-get install -y fonts-ipafont fonts-ipaexfont

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: npm install
        run: npm ci

      # カレントディレクトリ配下の README.md を README.pdf へ変換する
      - name: Convert markdown to pdf
        run: npm run generate-pdf

      # 新規作成もしくは更新されたPDFファイルを自動コミットする
      - name: Commit output pdf files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update output pdf files
